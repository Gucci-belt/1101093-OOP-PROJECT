<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-screen">
        
        <header class="header">
            <span class="header-title">เมนูที่เลือกโดยรวม</span>
            <a href="profile.html" class="profile-icon"></a>
        </header>
        
        <div class="content">
            
            <div class="profile-info-box">
                <strong>เมนูทั้งหมด:</strong> <span id="total-items">0</span>
            </div>
            
            <div class="bmi-result-box" style="color: var(--primary-green);">
                <strong>รวมพลังงาน (Kcal):</strong> <span id="total-kcal">0</span>
            </div>

            <div class="profile-info-box">
                <strong>รวมไขมัน (g):</strong> <span id="total-fat">0</span>
            </div>
            
            <div class="profile-info-box">
                <strong>รวมน้ำตาล (g):</strong> <span id="total-sugar">0</span>
            </div>

            <div class="profile-info-box">
                <strong>รวมโซเดียม (mg):</strong> <span id="total-sodium">0</span>
            </div>

            <a href="home.html" class="btn" style="margin-top: 50px;">ยืนยัน</a>
        </div>
        
        <footer class="footer-nav">
            <a href="cart.html" class="footer-icon">⬅️</a>
            <a href="cart.html" class="footer-icon">🛒</a>
        </footer>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ตรวจสอบว่าผู้ใช้ login หรือยัง
            const username = localStorage.getItem('currentUser');
            if (!username) {
                window.location.href = 'login.html';
                return;
            }

            // 1. โหลดตะกร้าจาก API
            fetch(`http://localhost:8080/api/cart/${username}`)
                .then(response => response.json())
                .then(cart => {
                    // 2. สร้างตัวแปรสำหรับเก็บผลรวม
                    let totalKcal = 0;
                    let totalFat = 0;
                    let totalSugar = 0;
                    let totalSodium = 0;

                    // 3. วนลูปในตะกร้าเพื่อบวกค่า
                    cart.forEach(item => {
                        totalKcal += item.kcal;
                        totalFat += item.fat;
                        totalSugar += item.sugar;
                        totalSodium += item.sodium;
                    });

                    // 4. แสดงผลลัพธ์
                    document.getElementById('total-items').textContent = cart.length;
                    document.getElementById('total-kcal').textContent = totalKcal.toFixed(0); 
                    document.getElementById('total-fat').textContent = totalFat.toFixed(1);   
                    document.getElementById('total-sugar').textContent = totalSugar.toFixed(1);
                    document.getElementById('total-sodium').textContent = totalSodium.toFixed(0);

                    // 5. บันทึก tracking ทุกรายการในตะกร้า
                    saveAllToTracking(cart, username);
                })
                .catch(error => {
                    console.error('Error loading cart:', error);
                    alert('ไม่สามารถโหลดตะกร้าได้ (Backend ปิดอยู่?)');
                });

            // ฟังก์ชันบันทึก tracking ทุกรายการในตะกร้า
            function saveAllToTracking(cart, username) {
                if (cart.length === 0) {
                    return; // ถ้าตะกร้าว่าง ไม่ต้องบันทึก
                }

                // ใช้ Promise.all เพื่อบันทึกทั้งหมดพร้อมกัน
                const trackingPromises = cart.map(item => {
                    return fetch('http://localhost:8080/api/tracking/add', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username,
                            foodName: item.name
                        })
                    })
                    .then(response => response.json())
                    .catch(error => {
                        console.error('Error adding tracking for', item.name, ':', error);
                        return { status: 'failed', message: error.message };
                    });
                });

                Promise.all(trackingPromises)
                    .then(results => {
                        const successCount = results.filter(r => r.status === 'success').length;
                        console.log(`บันทึก tracking สำเร็จ ${successCount}/${cart.length} รายการ`);
                        
                        // หลังจากบันทึก tracking สำเร็จแล้ว ให้ล้างตะกร้า
                        clearCart(username);
                    })
                    .catch(error => {
                        console.error('Error saving tracking:', error);
                    });
            }

            // ฟังก์ชันล้างตะกร้า
            function clearCart(username) {
                fetch(`http://localhost:8080/api/cart/clear/${username}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        console.log('ล้างตะกร้าเรียบร้อยแล้ว');
                        // Trigger cart update event เพื่อให้หน้าอื่นๆ อัปเดต
                        const updateEvent = new Event('cartUpdated');
                        window.dispatchEvent(updateEvent);
                        localStorage.setItem(`cart_updated_${username}_${Date.now()}`, 'true');
                    }
                })
                .catch(error => {
                    console.error('Error clearing cart:', error);
                });
            }
        });
    </script>
</body>
</html>
