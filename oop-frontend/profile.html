<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="mobile-screen">
        
        <header class="header">
            <span class="header-title">โปรไฟล์</span>
            <a href="profile.html" class="profile-icon"></a>
        </header>
        
        <div class="content">
            <h2 class="page-title">ข้อมูลของคุณ</h2>

            <div class="form-group">
                <label for="edit-weight">น้ำหนัก (kg)</label>
                <input type="text" id="edit-weight">
            </div>
            
            <div class="form-group">
                <label for="edit-height">ส่วนสูง (cm)</label>
                <input type="text" id="edit-height">
            </div>

            <button id="recalcBtn" class="btn">บันทึกและคำนวณใหม่</button>
            
            <div class="bmi-result-box" id="profile-bmi-box">
                <strong>น้ำหนัก:</strong> <span id="profile-weight">--</span> kg
                <br>
                <strong>ส่วนสูง:</strong> <span id="profile-height">--</span> cm
                <br><br>
                <strong>ค่า BMI:</strong> <span id="profile-bmi">--.-</span>
                <br>
                <small>(ควรกิน <span id="profile-calories">----</span> แคลอรี่)</small>
            </div>
            
            <a href="bmi-history.html" class="btn btn-secondary" style="margin-bottom: 20px; width: 100%;">
                <i class="fas fa-chart-line"></i> ดูประวัติ BMI และกราฟ
            </a>
            
            <table class="bmi-table">
                <thead>
                    <tr>
                        <th>ค่ารูปร่าง</th>
                        <th>ค่า BMI</th>
                    </tr>
                </thead>
                <tbody id="bmi-table-body">
                    <tr>
                        <td>...</td>
                        <td>...</td>
                    </tr>
                </tbody>
            </table>

            <a href="login.html" class="btn btn-secondary-link" style="margin-top: 20px;" id="logoutBtn">ออกจากระบบ</a>
        </div>
        <footer class="footer-nav">
            <a href="home.html" class="footer-icon">⬅️</a>
            <a href="cart.html" class="footer-icon">🛒</a>
        </footer>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. หาชื่อผู้ใช้ปัจจุบัน
            const username = localStorage.getItem('currentUser');
            if (!username) {
                // ถ้าไม่ login ให้กลับไปหน้า login
                window.location.href = 'login.html';
                return;
            }

            // 2. ดึง Element ที่ต้องใช้
            const editWeight = document.getElementById('edit-weight');
            const editHeight = document.getElementById('edit-height');
            const recalcBtn = document.getElementById('recalcBtn');
            const profileWeight = document.getElementById('profile-weight');
            const profileHeight = document.getElementById('profile-height');
            const profileBmi = document.getElementById('profile-bmi');
            const profileCalories = document.getElementById('profile-calories');
            const bmiTableBody = document.getElementById('bmi-table-body');
            const logoutBtn = document.getElementById('logoutBtn');

            // 3. โหลดข้อมูลครั้งแรก
            loadProfileData();

            // 4. ผูก Event ให้ปุ่มคำนวณใหม่
            recalcBtn.addEventListener('click', function() {
                const newWeight = parseFloat(editWeight.value);
                const newHeight = parseFloat(editHeight.value);

                if (newWeight > 0 && newHeight > 0) {
                    // เรียก API เพื่อคำนวณ BMI
                    fetch('http://localhost:8080/api/bmi/calculate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username,
                            weight: newWeight,
                            height: newHeight
                        })
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.status === 'success') {
                            // อัปเดตหน้าจอทันทีหลังจากได้ข้อมูล
                            updateProfileDisplay({
                                weight: newWeight,
                                height: newHeight,
                                bmi: data.bmi,
                                calories: data.calories,
                                category: data.category,
                                categoryRange: data.categoryRange
                            });
                            
                            // บันทึก BMI History
                            recordBMIHistory(username, newWeight, newHeight);
                            
                            // รีโหลดข้อมูลจาก API เพื่อให้แน่ใจว่าข้อมูลถูกต้อง
                            setTimeout(() => {
                                loadProfileData();
                            }, 100);
                            
                            alert('บันทึกข้อมูลใหม่แล้ว!');
                            // Update streak
                            localStorage.setItem(`lastUpdate_${username}`, new Date().toISOString());
                        } else {
                            alert('เกิดข้อผิดพลาด: ' + (data.message || 'ไม่สามารถคำนวณได้'));
                        }
                    })
                    .catch(error => {
                        console.error('Error calculating BMI:', error);
                        let errorMessage = 'ไม่สามารถเชื่อมต่อกับ server ได้';
                        if (error.message) {
                            errorMessage = error.message;
                        }
                        alert('เกิดข้อผิดพลาด: ' + errorMessage + '\n\nกรุณาตรวจสอบว่า Backend Server กำลังรันอยู่ที่ http://localhost:8080');
                        
                        // แสดงข้อมูลในช่องสีเหลี่ยมแบบชั่วคราวจากการคำนวณฝั่ง client
                        const calculatedBmi = (newWeight / ((newHeight / 100) ** 2)).toFixed(1);
                        const calories = Math.round(newWeight * 24);
                        let category = '';
                        let categoryRange = '';
                        
                        if (calculatedBmi < 18.5) {
                            category = 'น้ำหนักน้อย';
                            categoryRange = 'น้อยกว่า 18.5';
                        } else if (calculatedBmi < 23.0) {
                            category = 'ปกติ';
                            categoryRange = '18.5 - 22.9';
                        } else if (calculatedBmi < 25.0) {
                            category = 'น้ำหนักเกิน';
                            categoryRange = '23.0 - 24.9';
                        } else if (calculatedBmi < 30.0) {
                            category = 'อ้วน';
                            categoryRange = '25.0 - 29.9';
                        } else {
                            category = 'อ้วนมาก';
                            categoryRange = '30.0 ขึ้นไป';
                        }
                        
                        updateProfileDisplay({
                            weight: newWeight,
                            height: newHeight,
                            bmi: calculatedBmi,
                            calories: calories,
                            category: category,
                            categoryRange: categoryRange
                        });
                    });
                } else {
                    alert('กรุณากรอกข้อมูลให้ถูกต้อง');
                }
            });

            // 5. ฟังก์ชันโหลดข้อมูลน้ำหนักและส่วนสูง
            function loadUserData() {
                fetch(`http://localhost:8080/api/bmi/data/${username}`)
                    .then(response => {
                        if (!response.ok) {
                            // ถ้า response ไม่ ok แต่ไม่ใช่ 404 อาจจะเป็น server error
                            if (response.status !== 404) {
                                throw new Error('Server error: ' + response.status);
                            }
                            // ถ้า 404 แสดงว่าไม่มีข้อมูล ไม่ต้องทำอะไร
                            return null;
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data && data.status === 'success') {
                            // แสดงข้อมูลใน input fields
                            editWeight.value = data.weight;
                            editHeight.value = data.height;
                            // แสดงข้อมูลในผลลัพธ์
                            profileWeight.textContent = data.weight;
                            profileHeight.textContent = data.height;
                        }
                    })
                    .catch(error => {
                        console.error('Error loading user data:', error);
                        // ไม่แสดง error ถ้ายังไม่มีข้อมูล (อาจเป็นครั้งแรกที่ใช้)
                    });
            }

            // 6. ฟังก์ชันบันทึก BMI History
            function recordBMIHistory(username, weight, height) {
                fetch('http://localhost:8080/api/bmi/history/record', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        weight: weight,
                        height: height
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        console.log('บันทึก BMI History สำเร็จ:', data);
                    }
                })
                .catch(error => {
                    console.error('Error recording BMI history:', error);
                    // ไม่แสดง error ให้ user เพราะไม่ใช่ฟีเจอร์หลัก
                });
            }

            // 7. ฟังก์ชันโหลดข้อมูล BMI จาก API
            function loadProfileData() {
                // โหลดข้อมูลน้ำหนักและส่วนสูงก่อน
                loadUserData();
                
                // เรียก API เพื่อดึงข้อมูล BMI
                fetch(`http://localhost:8080/api/bmi/${username}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.status === 'success') {
                            // ใช้ข้อมูลจาก API โดยตรง
                            const weight = parseFloat(data.weight) || parseFloat(editWeight.value) || 0;
                            const height = parseFloat(data.height) || parseFloat(editHeight.value) || 0;
                            
                            // อัปเดตส่วนแสดงผล
                            updateProfileDisplay({
                                weight: weight,
                                height: height,
                                bmi: data.bmi,
                                calories: data.calories,
                                category: data.category,
                                categoryRange: data.categoryRange
                            });
                            
                            // อัปเดต input fields
                            if (weight > 0) {
                                editWeight.value = weight;
                            }
                            if (height > 0) {
                                editHeight.value = height;
                            }
                        } else {
                            // กรณีไม่เคยกรอกข้อมูล - ยังคงแสดงโครงสร้างช่องสีเหลี่ยม
                            const bmiBox = document.getElementById('profile-bmi-box');
                            bmiBox.innerHTML = `
                                <strong>น้ำหนัก:</strong> <span id="profile-weight">--</span> kg
                                <br>
                                <strong>ส่วนสูง:</strong> <span id="profile-height">--</span> cm
                                <br><br>
                                <strong>ค่า BMI:</strong> <span id="profile-bmi">--.-</span>
                                <br>
                                <small>(ควรกิน <span id="profile-calories">----</span> แคลอรี่)</small>
                                <br><br>
                                <small style="color: #ff6b6b;">ไม่พบข้อมูล BMI - กรุณาคำนวณใหม่</small>
                            `;
                            bmiTableBody.innerHTML = '<tr><td>-</td><td>-</td></tr>';
                        }
                    })
                    .catch(error => {
                        console.error('Error loading BMI:', error);
                        // แสดงโครงสร้างช่องสีเหลี่ยมแม้มี error
                        const bmiBox = document.getElementById('profile-bmi-box');
                        bmiBox.innerHTML = `
                            <strong>น้ำหนัก:</strong> <span id="profile-weight">--</span> kg
                            <br>
                            <strong>ส่วนสูง:</strong> <span id="profile-height">--</span> cm
                            <br><br>
                            <strong>ค่า BMI:</strong> <span id="profile-bmi">--.-</span>
                            <br>
                            <small>(ควรกิน <span id="profile-calories">----</span> แคลอรี่)</small>
                            <br><br>
                            <small style="color: #ff6b6b;">ไม่พบข้อมูล BMI - กรุณาคำนวณใหม่</small>
                        `;
                        bmiTableBody.innerHTML = '<tr><td>-</td><td>-</td></tr>';
                    });
            }

            // 7. ฟังก์ชันอัปเดตหน้าจอ (น้ำหนัก, ส่วนสูง, BMI, แคลอรี, ตาราง)
            function updateProfileDisplay(data) {
                // แสดงน้ำหนักและส่วนสูง
                if (data.weight) {
                    profileWeight.textContent = data.weight;
                    editWeight.value = data.weight; // อัปเดต input field ด้วย
                }
                if (data.height) {
                    profileHeight.textContent = data.height;
                    editHeight.value = data.height; // อัปเดต input field ด้วย
                }
                
                // แสดง BMI และแคลอรี่
                if (data.bmi) {
                    profileBmi.textContent = data.bmi;
                }
                if (data.calories) {
                    profileCalories.textContent = data.calories;
                }
                
                // อัปเดตตาราง (ใช้ข้อมูลจาก API)
                if (data.category && data.categoryRange) {
                    bmiTableBody.innerHTML = `<tr><td>${data.category}</td><td>${data.categoryRange}</td></tr>`;
                }
                
                // ตรวจสอบว่า bmi-result-box แสดงข้อมูลอยู่หรือไม่
                const bmiBox = document.getElementById('profile-bmi-box');
                if (bmiBox && data.bmi) {
                    // กำหนด HTML ให้ช่องสีเหลี่ยมใหม่เพื่อให้แน่ใจว่าข้อมูลแสดงทุกครั้ง
                    bmiBox.innerHTML = `
                        <strong>น้ำหนัก:</strong> <span id="profile-weight">${data.weight || '--'}</span> kg
                        <br>
                        <strong>ส่วนสูง:</strong> <span id="profile-height">${data.height || '--'}</span> cm
                        <br><br>
                        <strong>ค่า BMI:</strong> <span id="profile-bmi">${data.bmi || '--.-'}</span>
                        <br>
                        <small>(ควรกิน <span id="profile-calories">${data.calories || '----'}</span> แคลอรี่)</small>
                    `;
                    // อัปเดต reference ใหม่
                    profileWeight.textContent = data.weight || '--';
                    profileHeight.textContent = data.height || '--';
                    profileBmi.textContent = data.bmi || '--.-';
                    profileCalories.textContent = data.calories || '----';
                }
            }

            // 8. ล้างข้อมูลเมื่อออกจากระบบ
            logoutBtn.addEventListener('click', function() {
                localStorage.removeItem('currentUser');
                localStorage.removeItem('currentUserRole');
                localStorage.removeItem('cart'); 
            });
        });
    </script>
</body>
</html>
